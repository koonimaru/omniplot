[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "omniplot"
dynamic = ["version"]
description = "Scientific plotting and statistical analysis — an R-like toolbox for Python researchers"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Koh Onimaru", email = "koh.onimaru@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pandera>=0.20",
    "fastcluster>=1.2",
    "natsort>=8.4",
    "joblib>=1.4",
    "igraph>=0.11",
    "networkx>=3.3",
    "adjustText>=1.0",
    "umap-learn",
]

[project.optional-dependencies]
# Dimensionality reduction and clustering
ml = [
    "umap-learn>=0.5",
    "scikit-fuzzy>=0.4",
    "scikit-image>=0.24",
    "cvxopt>=1.3",
]
# Network visualization
network = [
    "datashader>=0.16",
    "python-louvain>=0.16",
]
# ChIP-seq / genomics analysis
chipseq = [
    "pyranges>=0.0.129",
    "bioframe>=0.4",
    "intervaltree>=3.1",
]
# Development tools
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# All optional extras
all = [
    "omniplot[ml,network,chipseq]",
]

[project.urls]
Homepage = "https://github.com/koonimaru/omniplot"
Documentation = "https://koonimaru.github.io/omniplot"
Repository = "https://github.com/koonimaru/omniplot"
Issues = "https://github.com/koonimaru/omniplot/issues"

# ---------------------------------------------------------------------------
# Dynamic versioning from git tags (e.g. v0.4.10 → 0.4.10)
# Run `git tag v0.4.10` to set the current release version.
# ---------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"
fallback-version = "0.4.10"

[tool.hatch.build.hooks.vcs]
version-file = "omniplot/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["build/", "dist/", "_docs/", "ipynb/", "tests/", "*.egg-info"]

[tool.hatch.build.targets.wheel]
packages = ["omniplot"]

# ---------------------------------------------------------------------------
# UV workspace / tool configuration
# ---------------------------------------------------------------------------
[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
# Exclude legacy script-style files and chipseq-specific tests (need optional extras)
collect_ignore_glob = [
    "tests/gather_ids.py",
    "tests/tests_scatter.py",
    "tests/tests heatmap.py",
    "tests/test_chipseq.py",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # mutable default args (common in matplotlib wrappers)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is fine in tests

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
